async function readText(path) {
    const response = await fetch(path, {cache: "no-store"});
    if (!response.ok) throw new Error(`HTTP ${response.status}: ${path}`);
    return response.text();
}

async function resolveVideoSource() {
    const params = new URLSearchParams(window.location.search);
    const playlist = params.get("playlist");
    if (playlist) return readText(playlist);

    const raw = window.location.search.length > 1
        ? decodeURIComponent(window.location.search.substring(1))
        : "test.js";
    if (raw.toLowerCase().endsWith(".js") || raw.toLowerCase().endsWith(".dome")) {
        return readText(raw.replace(/\\/g, "/"));
    }

    const normalized = raw.replace(/\\/g, "/");
    const webRoot = normalized.toLowerCase().indexOf("/www/");
    const url = webRoot >= 0 ? normalized.substring(webRoot + 4) : normalized;
    return `0,0,0,0,,${url.startsWith("/") ? url : "/" + url}`;
}
