<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fulldome Web Player</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #aaa;
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
        }
        canvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        .random-video {
            --opacity-time: 1;
            position: absolute;
            width: 300px;
            height: 180px;
            visibility: hidden;
        }
        .random-video > video {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            border: 0;
            opacity: 0;
            transition: opacity calc(var(--opacity-time) * 1ms) linear;
        }
    </style>
    <script src="libs/three/three.js" defer></script>
    <script src="libs/common.js" defer></script>
    <script src="libs/FullDomeRenderer.js" defer></script>
    <script src="scenes/cubes.js" defer></script>
    <script src="libs/FullDomeRendererPlayer.js" defer></script>
</head>
<body>
    <div class="random-video" aria-hidden="true"></div>
</body>
</html>
